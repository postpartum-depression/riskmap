{% extends 'base.html' %}

{% block title %}Пароль изменен - RiskMap{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">✓ Пароль изменен</h4>
                </div>
                <div class="card-body text-center">
                    <p class="lead">
                        Ваш пароль успешно изменен!
                    </p>
                    <p class="text-muted">
                        Теперь вы можете использовать новый пароль для входа в систему.
                    </p>
                    
                    <div class="mt-4">
                        <a href="{% url 'authentication:login' %}" class="btn btn-primary">
                            Войти в систему
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
