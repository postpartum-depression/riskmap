{% extends 'base.html' %}

{% block title %}Письмо отправлено - RiskMap{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">✓ Письмо отправлено</h4>
                </div>
                <div class="card-body text-center">
                    <p class="lead">
                        Мы отправили вам письмо с инструкциями по сбросу пароля.
                    </p>
                    <p class="text-muted">
                        Проверьте ваш email (не забудьте папку "Спам").
                    </p>
                    
                    <div class="mt-4">
                        <a href="{% url 'authentication:login' %}" class="btn btn-primary">
                            Вернуться ко входу
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
